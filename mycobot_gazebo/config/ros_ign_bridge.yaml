# Ignition Gazebo Fortress bridge configuration
# Adapted from automaticaddison/mycobot_ros2 for ROS2 Humble + Ignition Fortress

# ign topic published by Sensors plugin
- ros_topic_name: "camera_head/depth/camera_info"
  gz_topic_name: "camera_head/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "ignition.msgs.CameraInfo"
  direction: GZ_TO_ROS
  lazy: true

# ign topic published by Sensors plugin
- ros_topic_name: "camera_head/depth/color/points"
  gz_topic_name: "camera_head/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "ignition.msgs.PointCloudPacked"
  direction: GZ_TO_ROS
  lazy: true
  
# Clock configuration
- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "ignition.msgs.Clock"
  direction: GZ_TO_ROS
  lazy: false

